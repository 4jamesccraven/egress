[package]
name = "egress"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "egressd"
path = "src/bin/daemon.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
