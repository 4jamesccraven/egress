[package]
name = "egress"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "egressd"
path = "src/bin/daemon.rs"

[[bin]]
name = "egressctl"
path = "src/bin/client.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = "0.9.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
